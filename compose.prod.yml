# Production / self-hosting: app (prod image) + database.
# Use with: docker compose -f compose.yml -f compose.prod.yml up -d
# Set DATABASE_URL in .env (e.g. postgresql://harpo:harpo@database:5432/harpo)
# and run migrations once (see docs/SELF_HOST.md).

services:
  app:
    build:
      target: prod
    ports:
      - ${APP_PORT:-3000}:3000
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}

  database:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-harpo}
      - POSTGRES_USER=${POSTGRES_USER:-harpo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-harpo}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${POSTGRES_DB:-harpo}",
          "-U",
          "${POSTGRES_USER:-harpo}",
        ]
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data:rw

volumes:
  db_data:
