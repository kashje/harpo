# Production / self-hosting: app (prod image). Redis is in compose.yml.
# Use with: docker compose -f compose.yml -f compose.prod.yml up -d
# Set in .env:
#   REDIS_PASSWORD (required, no default in production)
#   REDIS_URL (e.g. redis://:<REDIS_PASSWORD>@redis:6379)
# Redis is only reachable from the compose network; its port isn't published.

services:
  app:
    build:
      target: prod
    ports:
      - ${APP_PORT:-3000}:3000

  redis:
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
