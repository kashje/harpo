name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harpo
          POSTGRES_PASSWORD: harpo
          POSTGRES_DB: harpo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d harpo_test -U harpo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          DATABASE_URL=postgresql://harpo:harpo@localhost:5432/harpo_test
          URL_ID_ENC_KEY=${{ secrets.URL_ID_ENC_KEY }}
          CREATOR_FINGERPRINT_SALT=ci-test-salt
          NEXT_PUBLIC_LAST_VIEW_COUNTDOWN_SECONDS=30
          EOF

      - name: Run migrations
        run: pnpm test:db:push

      - name: Run tests
        run: pnpm test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SKIP_ENV_VALIDATION: 1
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: harpo:test
          cache-from: type:gha
          cache-to: type:gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm release

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          IMG="ghcr.io/${{ github.repository }}"
          if [[ "$TAG" == *"-next"* ]]; then
            echo "tags=$IMG:next,$IMG:$VER" >> $GITHUB_OUTPUT
          else
            MAJOR_MINOR="$(echo "$VER" | cut -d. -f1,2)"
            echo "tags=$IMG:latest,$IMG:$VER,$IMG:$MAJOR_MINOR" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type:gha
          cache-to: type:gha,mode=max
