# Development only: database and Redis ports are published to the host here, never in production.
services:
  database:
    ports:
      - ${POSTGRES_PORT:-5432}:5432

  redis:
    ports:
      - ${REDIS_PORT:-6379}:6379

  app:
    build:
      target: dev
    volumes:
      - .:/srv/app
    ports:
      - ${APP_PORT:-3000}:3000

  studio:
    image: node:${NODE_VERSION:-20}-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL}
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm drizzle-kit studio --host 0.0.0.0 --port 4983"
    ports:
      - ${STUDIO_PORT:-4983}:4983
    depends_on:
      - database
