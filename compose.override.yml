services:
  app:
    build:
      target: dev
    volumes:
      - .:/srv/app
    ports:
      - ${APP_PORT:-3000}:3000

  database:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-harpo}
      - POSTGRES_USER=${POSTGRES_USER:-harpo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-harpo}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${POSTGRES_DB:-harpo}",
          "-U",
          "${POSTGRES_USER:-harpo}",
        ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - db_data:/var/lib/postgresql/data:rw

  studio:
    image: node:${NODE_VERSION:-20}-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL}
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm drizzle-kit studio --host 0.0.0.0 --port 4983"
    ports:
      - ${STUDIO_PORT:-4983}:4983
    depends_on:
      - database

volumes:
  db_data:
