services:
  app:
    image: ${IMAGES_PREFIX:-}app-web
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy

  # Redis is the only datastore. It deliberately runs without persistence: after a restart every
  # secret is gone, so a secret that was already viewed can never come back.
  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      start_period: 5s
